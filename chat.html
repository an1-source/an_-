<!DOCTYPE html>
<!-- 安家成 | 日期：2026-11-12 | 模型：Seed-Code | 功能：百域实验室 baiyulabs DeepSeek AI 聊天 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 聊天 · DeepSeek</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #e2e8f0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .an_back {
            position: fixed; top: 10px; left: 10px; z-index: 50;
            display: inline-block; color: #fff; text-decoration: none;
            font-size: 12px; background: rgba(255,255,255,0.15);
            padding: 4px 12px; border-radius: 14px;
        }
        .an_back:hover { background: rgba(255,255,255,0.3); }

        /* ========== 顶部 ========== */
        .an_header {
            height: 60px;
            background: rgba(15,23,42,0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(148,163,184,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-shrink: 0;
            position: relative;
        }
        .an_dot { width: 10px; height: 10px; border-radius: 50%;
                  background: #4ade80; box-shadow: 0 0 10px #4ade80;
                  animation: an_pulse 2s infinite; }
        @keyframes an_pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }
        .an_header h1 { font-size: 18px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .an_header .an_model {
            font-size: 11px; color: #94a3b8;
            background: rgba(255,255,255,0.08);
            padding: 2px 10px; border-radius: 10px;
        }
        .an_settings-btn {
            position: absolute; right: 16px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            color: #cbd5e1; width: 32px; height: 32px;
            border-radius: 50%; cursor: pointer; font-size: 14px;
            transition: background 0.2s, transform 0.3s;
        }
        .an_settings-btn:hover { background: rgba(255,255,255,0.22); transform: rotate(45deg); }

        /* ========== 弹窗 ========== */
        .an_modal {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 100; display: none;
            align-items: center; justify-content: center;
        }
        .an_modal.show { display: flex; animation: an_fadeIn .2s; }
        @keyframes an_fadeIn { from{opacity:0;} to{opacity:1;} }
        .an_modal-box {
            background: #1e293b;
            border: 1px solid rgba(148,163,184,0.25);
            border-radius: 14px; padding: 22px 26px;
            width: 90%; max-width: 500px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .an_modal-box h3 { color: #f1f5f9; margin-bottom: 12px; font-size: 16px; }
        .an_modal-field { margin-bottom: 12px; }
        .an_modal-field label {
            display: block; color: #94a3b8; font-size: 12px; margin-bottom: 5px;
        }
        .an_modal-field input, .an_modal-field select {
            width: 100%;
            background: #0f172a;
            border: 1px solid rgba(148,163,184,0.3);
            border-radius: 8px; padding: 9px 12px;
            color: #e2e8f0; font-size: 13px;
            font-family: Consolas, monospace; outline: none;
            transition: border-color 0.2s;
        }
        .an_modal-field input:focus, .an_modal-field select:focus { border-color: #60a5fa; }
        .an_modal-hint { color: #94a3b8; font-size: 11px; margin-bottom: 12px; line-height: 1.5; }
        .an_modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 14px; }
        .an_modal-cancel, .an_modal-save {
            padding: 7px 18px; border-radius: 8px; cursor: pointer; font-size: 13px; border: none;
        }
        .an_modal-cancel { background: rgba(148,163,184,0.15); color: #cbd5e1; }
        .an_modal-cancel:hover { background: rgba(148,163,184,0.3); }
        .an_modal-save {
            background: linear-gradient(135deg, #3b82f6, #7c3aed);
            color: #fff; font-weight: bold;
        }
        .an_modal-save:hover { opacity: 0.9; }

        /* ========== 消息 ========== */
        .an_chat {
            flex: 1; overflow-y: auto;
            padding: 20px 16px 10px;
            max-width: 900px; margin: 0 auto; width: 100%;
        }
        .an_msg { display: flex; margin-bottom: 16px; gap: 10px;
                  animation: an_fade .3s ease; }
        @keyframes an_fade { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:none;} }
        .an_avatar {
            width: 34px; height: 34px; border-radius: 50%;
            flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 16px;
        }
        .an_user .an_avatar { background: linear-gradient(135deg,#60a5fa,#3b82f6); }
        .an_ai   .an_avatar { background: linear-gradient(135deg,#a78bfa,#7c3aed); }
        .an_bubble {
            max-width: 75%; padding: 12px 16px; border-radius: 14px;
            line-height: 1.7; font-size: 14px;
            white-space: pre-wrap; word-break: break-word;
        }
        .an_user { flex-direction: row-reverse; }
        .an_user .an_bubble {
            background: linear-gradient(135deg,#3b82f6,#2563eb);
            border-bottom-right-radius: 4px;
        }
        .an_ai .an_bubble {
            background: rgba(30,41,59,0.9);
            border: 1px solid rgba(148,163,184,0.2);
            border-bottom-left-radius: 4px;
        }
        .an_err .an_bubble {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.4);
            color: #fca5a5; font-size: 13px;
        }

        /* Loading */
        .an_typing .an_bubble { padding: 14px 18px; }
        .an_typing span {
            display: inline-block; width: 6px; height: 6px;
            border-radius: 50%; background: #94a3b8;
            margin: 0 2px; animation: an_bounce 1.2s infinite ease-in-out;
        }
        .an_typing span:nth-child(2){animation-delay:.15s;}
        .an_typing span:nth-child(3){animation-delay:.3s;}
        @keyframes an_bounce {
            0%,80%,100%{transform:scale(.6);opacity:.5;}
            40%{transform:scale(1);opacity:1;}
        }

        /* ========== 输入区 ========== */
        .an_input-area {
            flex-shrink: 0; padding: 12px 16px 16px;
            max-width: 900px; margin: 0 auto; width: 100%;
        }
        .an_input-wrap {
            background: rgba(30,41,59,0.9);
            border: 1px solid rgba(148,163,184,0.25);
            border-radius: 16px; padding: 10px 12px;
            display: flex; align-items: flex-end; gap: 10px;
            transition: border-color 0.2s;
        }
        .an_input-wrap:focus-within {
            border-color: #60a5fa;
            box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
        }
        textarea.an_input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #e2e8f0; font-family: inherit; font-size: 14px;
            resize: none; max-height: 150px; line-height: 1.6;
        }
        textarea.an_input::placeholder { color: #64748b; }
        button.an_send {
            background: linear-gradient(135deg,#3b82f6,#7c3aed);
            color: #fff; border: none; border-radius: 12px;
            padding: 10px 18px; font-size: 13px; cursor: pointer; font-weight: bold;
            transition: opacity .2s, transform .1s; flex-shrink: 0;
        }
        button.an_send:hover:not(:disabled) { opacity: 0.9; }
        button.an_send:active:not(:disabled) { transform: scale(.96); }
        button.an_send:disabled { opacity: .4; cursor: not-allowed; }

        .an_input-tools {
            display: flex; justify-content: space-between;
            margin-top: 8px; font-size: 11px; color: #64748b;
        }
        .an_clear { background: none; border: none; color: #64748b; cursor: pointer; font-size: 11px; }
        .an_clear:hover { color: #ef4444; }

        /* scrollbar */
        .an_chat::-webkit-scrollbar { width: 6px; }
        .an_chat::-webkit-scrollbar-track { background: transparent; }
        .an_chat::-webkit-scrollbar-thumb {
            background: rgba(148,163,184,.25); border-radius: 3px;
        }
        .an_chat::-webkit-scrollbar-thumb:hover { background: rgba(148,163,184,.45); }
    </style>
</head>
<body>
    <a class="an_back" href="index.html">← 返回首页</a>

    <!-- 顶部 -->
    <div class="an_header">
        <div class="an_dot"></div>
        <h1>🤖 AI 智能助手</h1>
        <span class="an_model" id="an_headerModel">—</span>
        <button class="an_settings-btn" id="an_settingsBtn" title="设置">⚙️</button>
    </div>

    <!-- 设置弹窗 -->
    <div class="an_modal" id="an_modal">
        <div class="an_modal-box">
            <h3>⚙️ API 设置（百域实验室 baiyulabs）</h3>
            <div class="an_modal-field">
                <label>API Base URL</label>
                <input type="text" id="an_inpBase" placeholder="https://api.baiyulabs.com/v1" />
            </div>
            <div class="an_modal-field">
                <label>API Key</label>
                <input type="text" id="an_inpKey" placeholder="sk-..." />
            </div>
            <div class="an_modal-field">
                <label>模型</label>
                <select id="an_inpModel">
                    <option value="deepseek-v4.1-flash">deepseek-v4.1-flash（推荐，快且便宜）</option>
                    <option value="deepseek-v4-pro">deepseek-v4-pro（更强但慢）</option>
                </select>
            </div>
            <p class="an_modal-hint">
                数据保存在浏览器 localStorage。百域实验室 OpenAI 兼容接口：<br>
                <code>POST /v1/chat/completions</code>
            </p>
            <div class="an_modal-actions">
                <button class="an_modal-cancel" id="an_modalCancel">取消</button>
                <button class="an_modal-save" id="an_modalSave">保存</button>
            </div>
        </div>
    </div>

    <!-- 消息区 -->
    <div class="an_chat" id="an_chat"></div>

    <!-- 输入区 -->
    <div class="an_input-area">
        <div class="an_input-wrap">
            <textarea class="an_input" id="an_input" rows="1"
                      placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
            <button class="an_send" id="an_send">发送</button>
        </div>
        <div class="an_input-tools">
            <span id="an_status">就绪</span>
            <button class="an_clear" id="an_clear">🗑 清空对话</button>
        </div>
    </div>

    <script>
        // ========== 配置（localStorage 持久化） ==========
        const an_CONFIG = {
            get baseUrl() {
                return localStorage.getItem("an_baiyulabs_base") ||
                       "https://api.baiyulabs.com/v1";
            },
            set baseUrl(v) { localStorage.setItem("an_baiyulabs_base", v.trim().replace(/\/$/, "")); },
            get model() {
                return localStorage.getItem("an_baiyulabs_model") ||
                       "deepseek-v4.1-flash";
            },
            set model(v) { localStorage.setItem("an_baiyulabs_model", v); },
            get apiKey() {
                return localStorage.getItem("an_baiyulabs_key") ||
                       "sk-9dAYudJAgKhmiXSbgEAUHIyGWKgJWszGXwizueHGQwruU2IY";
            },
            set apiKey(v) { localStorage.setItem("an_baiyulabs_key", v.trim()); },
            systemPrompt: "你是一个有用的助手，请用中文简洁回答用户问题。",
            get url() { return this.baseUrl + "/chat/completions"; }
        };

        // ========== DOM ==========
        const an_chatEl     = document.getElementById("an_chat");
        const an_inputEl    = document.getElementById("an_input");
        const an_sendBtn    = document.getElementById("an_send");
        const an_clearBtn   = document.getElementById("an_clear");
        const an_statusEl   = document.getElementById("an_status");
        const an_modal      = document.getElementById("an_modal");
        const an_settingsBtn= document.getElementById("an_settingsBtn");
        const an_inpBase    = document.getElementById("an_inpBase");
        const an_inpKey     = document.getElementById("an_inpKey");
        const an_inpModel   = document.getElementById("an_inpModel");
        const an_modalCancel= document.getElementById("an_modalCancel");
        const an_modalSave  = document.getElementById("an_modalSave");
        const an_headerModel= document.getElementById("an_headerModel");

        // ========== 顶部模型显示 ==========
        an_headerModel.textContent = an_CONFIG.model;

        // ========== 设置弹窗逻辑 ==========
        an_settingsBtn.addEventListener("click", () => {
            an_inpBase.value  = an_CONFIG.baseUrl;
            an_inpKey.value   = an_CONFIG.apiKey;
            an_inpModel.value = an_CONFIG.model;
            an_modal.classList.add("show");
            setTimeout(() => an_inpKey.focus(), 50);
        });
        an_modalCancel.addEventListener("click", () => an_modal.classList.remove("show"));
        an_modalSave.addEventListener("click", () => {
            const k = an_inpKey.value.trim();
            if (!k.startsWith("sk-")) { alert("API Key 应以 sk- 开头"); return; }
            an_CONFIG.baseUrl = an_inpBase.value;
            an_CONFIG.apiKey  = k;
            an_CONFIG.model   = an_inpModel.value;
            an_modal.classList.remove("show");
            an_headerModel.textContent = an_CONFIG.model;
            an_addMsg("ai", "✅ 设置已保存：\n· Base: " + an_CONFIG.baseUrl +
                        "\n· 模型: " + an_CONFIG.model);
        });
        an_modal.addEventListener("click", e => {
            if (e.target === an_modal) an_modal.classList.remove("show");
        });
        an_inpKey.addEventListener("keydown", e => {
            if (e.key === "Enter") an_modalSave.click();
        });

        // ========== 会话历史 ==========
        let an_messages = [
            { role: "system", content: an_CONFIG.systemPrompt }
        ];

        // ========== 工具 ==========
        function an_scrollBottom() { an_chatEl.scrollTop = an_chatEl.scrollHeight; }
        function an_setStatus(t) { an_statusEl.textContent = t; }

        function an_addMsg(role, content, isErr) {
            const div = document.createElement("div");
            div.className = "an_msg " + (role === "user" ? "an_user" : (isErr ? "an_err" : "an_ai"));
            div.innerHTML = `
                <div class="an_avatar">${role === "user" ? "👤" : "🤖"}</div>
                <div class="an_bubble"></div>`;
            div.querySelector(".an_bubble").textContent = content;
            an_chatEl.appendChild(div);
            an_scrollBottom();
            return div;
        }

        function an_addTyping() {
            const div = document.createElement("div");
            div.className = "an_msg an_ai an_typing";
            div.innerHTML = `<div class="an_avatar">🤖</div>
                             <div class="an_bubble"><span></span><span></span><span></span></div>`;
            an_chatEl.appendChild(div);
            an_scrollBottom();
            return div;
        }

        // ========== textarea 自动高度 ==========
        an_inputEl.addEventListener("input", () => {
            an_inputEl.style.height = "auto";
            an_inputEl.style.height = Math.min(an_inputEl.scrollHeight, 150) + "px";
        });

        // ========== 键盘 ==========
        an_inputEl.addEventListener("keydown", e => {
            if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); an_send(); }
        });
        an_sendBtn.addEventListener("click", an_send);
        an_clearBtn.addEventListener("click", () => {
            if (!confirm("确定清空对话？")) return;
            an_messages = [{ role: "system", content: an_CONFIG.systemPrompt }];
            an_chatEl.innerHTML = "";
            an_addMsg("ai", "对话已清空，重新开始吧 😊");
            an_setStatus("就绪");
        });

        // ========== 发送 ==========
        async function an_send() {
            const text = an_inputEl.value.trim();
            if (!text) return;

            an_sendBtn.disabled = true;
            an_inputEl.disabled = true;
            an_setStatus("请求中...");

            an_addMsg("user", text);
            an_messages.push({ role: "user", content: text });
            an_inputEl.value = "";
            an_inputEl.style.height = "auto";

            // 控制台输出发送数据
            console.group("📤 发送给 LLM");
            console.log("URL:", an_CONFIG.url);
            console.log("Model:", an_CONFIG.model);
            console.log("Messages:", an_messages);
            console.groupEnd();

            const typingEl = an_addTyping();

            try {
                const an_body = {
                    model: an_CONFIG.model,
                    messages: an_messages,
                    max_tokens: 1024,
                    temperature: 0.7
                };
                const an_res = await fetch(an_CONFIG.url, {
                    method: "POST",
                    headers: {
                        "Content-Type":  "application/json",
                        "Authorization": "Bearer " + an_CONFIG.apiKey
                    },
                    body: JSON.stringify(an_body)
                });

                typingEl.remove();

                // 控制台原始响应
                const an_raw = await an_res.text();
                console.group("📥 原始响应");
                console.log("HTTP", an_res.status, an_res.statusText);
                console.log("Headers:", Object.fromEntries(an_res.headers.entries()));
                console.log("Raw:", an_raw);
                console.groupEnd();

                let an_data;
                try { an_data = JSON.parse(an_raw); }
                catch { throw new Error("响应非合法 JSON: " + an_raw.slice(0, 200)); }

                if (!an_res.ok) {
                    const an_m = an_data?.error?.message || an_data?.message || an_res.statusText;
                    throw new Error("(" + an_res.status + ") " + an_m);
                }

                console.group("📥 解析后数据");
                console.log(an_data);
                console.groupEnd();

                const an_reply = an_data?.choices?.[0]?.message?.content;
                if (!an_reply) throw new Error("响应无 choices[0].message.content");

                an_addMsg("ai", an_reply);
                an_messages.push({ role: "assistant", content: an_reply });
                an_setStatus("就绪 · tokens: " + (an_data?.usage?.total_tokens || "?"));

            } catch (err) {
                typingEl.remove();
                console.error("❌ 请求失败:", err);
                let an_msg = "请求失败：" + err.message;

                if (err.message.includes("(401)")) {
                    an_msg = "🔑 API Key 无效！点击右上角 ⚙️ 检查 Key 是否正确。";
                } else if (err.message.includes("(404)")) {
                    an_msg = "❌ 接口 404！请检查 API Base URL 是否正确（应为 .../v1）。";
                } else if (err.message.includes("(503)")) {
                    an_msg = "🌐 上游服务暂不可用 (503)，请稍后再试或换模型。";
                } else if (err.message.includes("Failed to fetch")) {
                    an_msg = "🌐 网络/CORS 错误。可能 API 未开放浏览器跨域访问。";
                }

                an_addMsg("ai", an_msg, true);
                an_setStatus("出错");
            } finally {
                an_sendBtn.disabled = false;
                an_inputEl.disabled = false;
                an_inputEl.focus();
            }
        }

        // ========== 欢迎 ==========
        an_addMsg("ai", "你好！我是 DeepSeek 智能助手 🤖\n\n接入：百域实验室 baiyulabs\n当前模型：" + an_CONFIG.model + "\n\n有什么想聊的？");
        an_inputEl.focus();
    </script>
</body>
</html>
