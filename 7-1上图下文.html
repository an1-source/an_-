<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        ul{
            list-style: none;
        }
        img{
            width: 100%;
            display: block;
        }
        .ilist{
            display: flex;
            margin:8px;
            gap: 8px;
        }
        .ilist li{
            width:30%;
            flex-grow: 1;
            position: relative;
        }
        .ilist li p{
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            text-align: center;
            font-size: 14px;
            line-height: 33px;
            color: #fff;
            background-color: rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>
    <ul class="ilist">
        <li>
            <img src="./image/1.png">
            <p>安家成的上图下文</p>
        </li>
        <li>
            <img src="./image/2.png">
            <p>安家成的上图下文</p>
        </li>
        <li>
            <img src="./image/3.png">
            <p>安家成的上图下文</p>
        </li>
    </ul>
</body>
</html>
