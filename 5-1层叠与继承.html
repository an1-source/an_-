<!DOCTYPE html>
<html lang="en">
<>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color:#f00;
            font-size: 100px;

        }
    </style>
    <link rel="stylesheet" href="css.css"></link>
    <style> 
        p{
            color: red;
            font-size: 100px;}
            .text{
                color: green;
            }
            #text{
                color: purple;
            }
            .box p{
                color: orange;
            }
            #box #text{
                color: silver;
            }
            .text{
                color: yellow!important;
                /* hack可覆盖内嵌css */
            }
            #box{
                /* 宽1400，高400，灰色背景，距离，字间距50px */
                width: 1400px;
                height: 400px;
                background-color: gray;
                margin: 10px;
                letter-spacing: 50px;
                /* 圆角矩形50% */
                border-radius: 50%;
            }
            /* 优先级：id>class>标签 */
        /* 后定义覆盖先定义 */
    </style>
</head>
<body>
    <h2>层叠与继承</h2>
    <div id="box" class="box"> 
        <p id="text" class="text">415 安家成</p>
        <p>
            层叠与继承的优先级
        </p>
        </div>
</body>
</html>
