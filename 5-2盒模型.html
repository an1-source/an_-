<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>盒子模型，块模型,box model</title>
    <style>
        body{
            padding: 0;
            margin: 0;
        }
        #a{
            width: 400px;
            height: 400px;
            margin: 40px auto;
            padding: 50px 40px 30px 20px;/* 上右下左 */
            border: 1px solid #039;
        }
        #b{
            width: 400px;
            height: 400px;
            margin: 50px auto 40px;
            border: 1px dashed #039;
        }
        /* 扩展：完成c和d，边框用dotted，宽度为3px */
        #c{
            width: 400px;
            height: 400px;
            margin: 50px auto 40px;
            border: 3px dotted #039;
        }
        #d{
            width: 400px;
            height: 400px;
            margin: 50px auto 40px;
            border: 3px dotted #039;
        }
        /* 扩展2: */
        </style>
</head>
<body>
    <div id="a"> 415安家成 </div>
    <div id="b"> 415安家成 </div>
    <div id="c"> 415安家成 </div>
    <div id="d"> 415安家成 </div>
</body>
</html>
