<!DOCTYPE html>
<!-- 安家成 | 日期：2026-11-05 | 模型：Seed-Code | 功能：Canvas 粒子文字动画 —— "安家成" -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-1 Canvas 粒子动画</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: #0a0a1a;
            overflow: hidden;
        }
        .an_back {
            position: fixed; top: 16px; left: 16px; z-index: 10;
            display: inline-block; color: #fff; text-decoration: none;
            font-size: 14px; background: rgba(255,255,255,0.15);
            padding: 6px 14px; border-radius: 20px;
        }
        .an_back:hover { background: rgba(255,255,255,0.3); }
        canvas#an_canvas {
            display: block;
            width: 100vw; height: 100vh;
        }
        .an_controls {
            position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
            background: rgba(20,20,40,0.85);
            border: 1px solid #2a2a50;
            border-radius: 28px;
            padding: 10px 20px;
            display: flex; gap: 8px; align-items: center;
            backdrop-filter: blur(8px);
            z-index: 10;
        }
        .an_controls label {
            font-size: 12px; color: #aaa;
        }
        .an_controls select, .an_controls input[type="text"] {
            background: #1a1a30; color: #fff;
            border: 1px solid #3a3a60; border-radius: 14px;
            padding: 5px 12px; font-size: 12px; outline: none;
        }
        .an_controls button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff; border: none; border-radius: 14px;
            padding: 5px 16px; font-size: 12px; cursor: pointer; font-weight: bold;
        }
        .an_controls button:hover { opacity: 0.85; }
        .an_hint {
            position: fixed; top: 16px; right: 16px; z-index: 10;
            color: rgba(255,255,255,0.4); font-size: 11px; text-align: right; line-height: 1.6;
        }
    </style>
</head>
<body>
    <a class="an_back" href="index.html">← 返回首页</a>
    <div class="an_hint">🖱 移动鼠标与粒子互动<br>点击画面：重新吸附</div>

    <canvas id="an_canvas"></canvas>

    <div class="an_controls">
        <input type="text" id="an_text" value="安家成" style="width:90px;">
        <select id="an_mode">
            <option value="gather">聚集</option>
            <option value="burst">爆发</option>
            <option value="float">飘浮</option>
            <option value="wave">波浪</option>
        </select>
        <button onclick="an_init('burst')">✨ 重新生成</button>
        <button onclick="an_change()">🔄 切换文字</button>
    </div>

    <script>
        const canvas = document.getElementById("an_canvas");
        const ctx = canvas.getContext("2d");
        let W, H;

        function an_resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", an_resize);
        an_resize();

        // 鼠标位置
        let an_mouse = { x: -9999, y: -9999 };
        canvas.addEventListener("mousemove", e => { an_mouse.x = e.clientX; an_mouse.y = e.clientY; });
        canvas.addEventListener("mouseleave", () => { an_mouse.x = -9999; an_mouse.y = -9999; });
        canvas.addEventListener("click", () => an_init("gather"));

        // ========== 粒子类 ==========
        class an_Particle {
            constructor(x, y, tx, ty) {
                this.x = x;      // 当前位置
                this.y = y;
                this.tx = tx;    // 目标位置（文字上的点）
                this.ty = ty;
                this.vx = 0;     // 速度
                this.vy = 0;
                this.r = 1.8 + Math.random() * 1.5;  // 半径
                this.hue = 200 + Math.random() * 160; // 色相
                this.mode = "gather";
                this.phase = Math.random() * Math.PI * 2;
            }
            setMode(m) { this.mode = m; }

            update(mouse) {
                // 基础吸附到目标
                const dx = this.tx - this.x;
                const dy = this.ty - this.y;

                switch (this.mode) {
                    case "burst":
                        // 爆发：向外飞
                        this.vx += this.vx * 0.92;
                        this.vy += this.vy * 0.92;
                        this.x += this.vx;
                        this.y += this.vy;
                        break;
                    case "float":
                        // 飘浮：加一点随机扰动
                        this.vx += dx * 0.02 + (Math.random() - 0.5) * 0.2;
                        this.vy += dy * 0.02 + (Math.random() - 0.5) * 0.2;
                        this.vx *= 0.92; this.vy *= 0.92;
                        this.x += this.vx; this.y += this.vy;
                        break;
                    case "wave":
                        // 波浪：目标点按时间偏移
                        const waveY = this.ty + Math.sin(Date.now() / 400 + this.phase) * 18;
                        this.vx += (this.tx - this.x) * 0.06;
                        this.vy += (waveY - this.y) * 0.06;
                        this.vx *= 0.86; this.vy *= 0.86;
                        this.x += this.vx; this.y += this.vy;
                        break;
                    default: // gather
                        this.vx += dx * 0.08;
                        this.vy += dy * 0.08;
                        this.vx *= 0.82; this.vy *= 0.82;
                        this.x += this.vx; this.y += this.vy;
                }

                // 鼠标排斥
                const mdx = this.x - mouse.x;
                const mdy = this.y - mouse.y;
                const mdist = Math.sqrt(mdx * mdx + mdy * mdy);
                if (mdist < 120) {
                    const f = (120 - mdist) / 120 * 3;
                    this.x += (mdx / mdist) * f;
                    this.y += (mdy / mdist) * f;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.fillStyle = `hsl(${this.hue}, 90%, 65%)`;
                ctx.shadowColor = `hsl(${this.hue}, 90%, 70%)`;
                ctx.shadowBlur = 8;
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            burstInit() {
                const ang = Math.random() * Math.PI * 2;
                const speed = 1 + Math.random() * 6;
                this.vx = Math.cos(ang) * speed;
                this.vy = Math.sin(ang) * speed;
            }
        }

        let an_particles = [];

        // ========== 从文字采样像素点 ==========
        function an_sampleText(text) {
            // 离屏 canvas 画文字，采样非透明像素
            const oc = document.createElement("canvas");
            const octx = oc.getContext("2d");

            // 自适应字号
            let fontSize = Math.min(W / text.length * 1.8, 180);
            fontSize = Math.max(fontSize, 80);
            octx.font = `bold ${fontSize}px "Microsoft YaHei", "SimHei", sans-serif`;
            const metrics = octx.measureText(text);
            const tw = metrics.width;
            const th = fontSize * 1.2;

            oc.width = tw + 20; oc.height = th + 20;
            octx.fillStyle = "#000";
            octx.fillRect(0, 0, oc.width, oc.height);
            octx.fillStyle = "#fff";
            octx.font = `bold ${fontSize}px "Microsoft YaHei", "SimHei", sans-serif`;
            octx.textBaseline = "middle";
            octx.fillText(text, 10, oc.height / 2);

            const img = octx.getImageData(0, 0, oc.width, oc.height).data;
            const pts = [];
            const step = Math.max(3, Math.floor(fontSize / 35)); // 采样步长
            const offsetX = (W - oc.width) / 2;
            const offsetY = (H - oc.height) / 2;

            for (let y = 0; y < oc.height; y += step) {
                for (let x = 0; x < oc.width; x += step) {
                    const idx = (y * oc.width + x) * 4;
                    if (img[idx] > 128) {
                        pts.push({ x: x + offsetX, y: y + offsetY });
                    }
                }
            }
            return pts;
        }

        // ========== 初始化 / 切换 ==========
        function an_init(mode) {
            const text = document.getElementById("an_text").value.trim() || "安家成";
            const pts = an_sampleText(text);
            const oldCount = an_particles.length;
            const newCount = pts.length;

            // 复用已有粒子（目标位置变了），多余的或新增的处理掉
            if (oldCount >= newCount) {
                for (let i = 0; i < newCount; i++) {
                    const p = an_particles[i];
                    p.tx = pts[i].x; p.ty = pts[i].y;
                    if (mode === "burst") p.burstInit();
                    p.setMode(mode);
                }
                an_particles = an_particles.slice(0, newCount);
            } else {
                for (let i = 0; i < oldCount; i++) {
                    const p = an_particles[i];
                    p.tx = pts[i].x; p.ty = pts[i].y;
                    p.setMode(mode);
                }
                for (let i = oldCount; i < newCount; i++) {
                    const np = new an_Particle(
                        Math.random() * W, Math.random() * H,
                        pts[i].x, pts[i].y
                    );
                    np.setMode(mode);
                    if (mode === "burst") np.burstInit();
                    an_particles.push(np);
                }
            }
        }

        function an_change() {
            const modes = ["gather", "burst", "float", "wave"];
            const sel = document.getElementById("an_mode");
            const m = sel.value || "gather";
            an_init(m);
        }

        // ========== 主循环 ==========
        function an_loop() {
            ctx.fillStyle = "rgba(10,10,26,0.22)";
            ctx.fillRect(0, 0, W, H);
            for (const p of an_particles) {
                p.update(an_mouse);
                p.draw();
            }
            requestAnimationFrame(an_loop);
        }

        // 启动
        window.addEventListener("resize", () => {
            an_resize();
            an_init("gather");
        });
        an_init("gather");
        an_loop();
    </script>
</body>
</html>
