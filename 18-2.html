<!DOCTYPE html>
<!-- 安家成 | 日期：2026-11-05 | 模型：Seed-Code | 功能：Canvas 电商系统架构图 -->
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>18-2 电商系统架构图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            padding: 20px;
        }
        .an_back {
            display: inline-block; color: #fff; text-decoration: none;
            margin-bottom: 14px; font-size: 14px;
            background: rgba(255,255,255,0.22);
            padding: 6px 14px; border-radius: 20px;
        }
        .an_back:hover { background: rgba(255,255,255,0.38); }
        .an_header {
            text-align: center; color: #fff; margin-bottom: 14px;
        }
        .an_header h1 { font-size: 24px; margin-bottom: 4px; }
        .an_header p { font-size: 12px; opacity: 0.8; }

        .an_canvas-wrap {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 14px;
            margin: 0 auto;
            max-width: 1180px;
        }
        canvas#an_arch {
            display: block;
            width: 100%;
            height: auto;
        }
        .an_tools {
            max-width: 1180px; margin: 10px auto 0;
            display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
        }
        .an_tools button {
            background: rgba(255,255,255,0.18); color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 14px; padding: 5px 14px; font-size: 12px; cursor: pointer;
        }
        .an_tools button:hover { background: rgba(255,255,255,0.32); }
        .an_tools button.active { background: #fff; color: #1e3c72; font-weight: bold; }

        .an_legend {
            max-width: 1180px; margin: 12px auto 0;
            background: rgba(255,255,255,0.12);
            border-radius: 10px; padding: 14px 18px;
            color: #fff; font-size: 12px; line-height: 1.9;
            backdrop-filter: blur(6px);
        }
        .an_legend .an_legend-title { font-weight: bold; margin-bottom: 6px; font-size: 13px; }
        .an_legend .dot {
            display: inline-block; width: 10px; height: 10px; border-radius: 2px;
            margin-right: 6px; vertical-align: -1px;
        }
    </style>
</head>
<body>
    <a class="an_back" href="index.html">← 返回首页</a>

    <div class="an_header">
        <h1>🏗 电商系统架构图</h1>
        <p>基于 Canvas 原生绘制 · 五层架构 · 鼠标悬停高亮</p>
    </div>

    <div class="an_canvas-wrap">
        <canvas id="an_arch" width="1150" height="760"></canvas>
    </div>

    <div class="an_tools">
        <button onclick="an_zoom(1)">🔍 放大</button>
        <button onclick="an_zoom(-1)">🔎 缩小</button>
        <button class="active" onclick="an_resetView()">🔄 重置视图</button>
        <button onclick="an_export()">📥 导出 PNG</button>
    </div>

    <div class="an_legend">
        <div class="an_legend-title">🎨 图例说明</div>
        <div><span class="dot" style="background:#667eea;"></span>客户端层（Web / App / 小程序）</div>
        <div><span class="dot" style="background:#f093fb;"></span>网关层（CDN / Nginx / API Gateway）</div>
        <div><span class="dot" style="background:#4facfe;"></span>业务服务层（微服务集群）</div>
        <div><span class="dot" style="background:#43e97b;"></span>数据层（MySQL / Redis / ES / MongoDB / OSS）</div>
        <div><span class="dot" style="background:#fa709a;"></span>基础设施层（MQ / 注册中心 / 容器编排 / 监控）</div>
        <div><span class="dot" style="background:#aaa;border-radius:50%;"></span>中间箭头：调用/依赖方向</div>
    </div>

    <script>
        const canvas = document.getElementById("an_arch");
        const ctx = canvas.getContext("2d");
        const C_W = canvas.width, C_H = canvas.height;

        let an_scale = 1;       // 当前缩放
        let an_hover = null;    // 当前悬停模块

        // ========== 架构数据 ==========
        // 每个模块：{ id, layer, x, y, w, h, title, desc, color }
        // layer: 0 客户端, 1 网关, 2 业务, 3 数据, 4 基础设施
        // 坐标系：左上角 (0,0)

        const an_layers = [
            { name: "① 客户端层",   color: "#667eea", y: 30 },
            { name: "② 网关层",     color: "#f093fb", y: 155 },
            { name: "③ 业务服务层", color: "#4facfe", y: 280 },
            { name: "④ 数据存储层", color: "#43e97b", y: 510 },
            { name: "⑤ 基础设施层", color: "#fa709a", y: 645 },
        ];

        // 客户端层：3 个并列
        const an_clients = [
            { id: "web",   title: "Web 端",     desc: "PC/H5 浏览器",        x: 150, y: 55, w: 200, h: 70, color: "#667eea" },
            { id: "app",   title: "移动 App",   desc: "iOS / Android",       x: 475, y: 55, w: 200, h: 70, color: "#667eea" },
            { id: "mp",    title: "小程序",     desc: "微信 / 支付宝 / 抖音", x: 800, y: 55, w: 200, h: 70, color: "#667eea" },
        ];

        // 网关层
        const an_gateways = [
            { id: "cdn",  title: "CDN",          desc: "静态资源加速",        x: 80,  y: 178, w: 160, h: 60, color: "#f093fb" },
            { id: "nginx", title: "Nginx 负载均衡", desc: "反向代理 / SSL",    x: 320, y: 178, w: 210, h: 60, color: "#f093fb" },
            { id: "gw",   title: "API Gateway",  desc: "鉴权 / 限流 / 路由",  x: 610, y: 178, w: 210, h: 60, color: "#f093fb" },
            { id: "waf",  title: "WAF 防火墙",    desc: "安全防护",           x: 880, y: 178, w: 160, h: 60, color: "#f093fb" },
        ];

        // 业务服务层
        const an_services = [
            { id: "user",    title: "用户中心",     desc: "注册/登录/权限",     x: 60,  y: 320, w: 155, h: 75, color: "#4facfe" },
            { id: "product", title: "商品服务",     desc: "SPU/SKU/分类",      x: 235, y: 320, w: 155, h: 75, color: "#4facfe" },
            { id: "order",   title: "订单服务",     desc: "下单/拆单/状态机",   x: 410, y: 320, w: 155, h: 75, color: "#4facfe" },
            { id: "pay",     title: "支付服务",     desc: "支付宝/微信/银联",   x: 585, y: 320, w: 155, h: 75, color: "#4facfe" },
            { id: "marketing", title: "营销服务",   desc: "秒杀/优惠券/拼团",   x: 760, y: 320, w: 155, h: 75, color: "#4facfe" },
            { id: "search",  title: "搜索服务",     desc: "全文检索/排序",      x: 935, y: 320, w: 155, h: 75, color: "#4facfe" },

            { id: "inventory", title: "库存服务",   desc: "扣减/回补/预警",     x: 145, y: 420, w: 155, h: 75, color: "#4facfe" },
            { id: "cart",    title: "购物车服务",   desc: "Redis 实时存储",     x: 320, y: 420, w: 155, h: 75, color: "#4facfe" },
            { id: "recommend", title: "推荐服务",   desc: "个性化算法",         x: 495, y: 420, w: 155, h: 75, color: "#4facfe" },
            { id: "notify",  title: "消息通知",     desc: "短信/邮件/站内信",   x: 670, y: 420, w: 155, h: 75, color: "#4facfe" },
            { id: "logistic", title: "物流服务",    desc: "运单/轨迹查询",      x: 845, y: 420, w: 155, h: 75, color: "#4facfe" },
        ];

        // 数据层
        const an_stores = [
            { id: "mysql",  title: "MySQL 主从",  desc: "业务核心数据",        x: 60,  y: 540, w: 170, h: 75, color: "#43e97b" },
            { id: "redis",  title: "Redis 集群",  desc: "缓存 / Session / 秒杀", x: 260, y: 540, w: 170, h: 75, color: "#43e97b" },
            { id: "es",     title: "Elasticsearch", desc: "商品搜索/日志分析", x: 460, y: 540, w: 190, h: 75, color: "#43e97b" },
            { id: "mongo",  title: "MongoDB",     desc: "订单日志/埋点",       x: 680, y: 540, w: 170, h: 75, color: "#43e97b" },
            { id: "oss",    title: "OSS 对象存储", desc: "图片/视频/文档",     x: 880, y: 540, w: 180, h: 75, color: "#43e97b" },
        ];

        // 基础设施层
        const an_infra = [
            { id: "kafka",    title: "Kafka / RocketMQ", desc: "异步消息队列",      x: 50,  y: 675, w: 210, h: 55, color: "#fa709a" },
            { id: "zk",       title: "Nacos / ZooKeeper", desc: "服务注册与配置",    x: 300, y: 675, w: 210, h: 55, color: "#fa709a" },
            { id: "docker",    title: "Docker + Kubernetes", desc: "容器编排",     x: 550, y: 675, w: 210, h: 55, color: "#fa709a" },
            { id: "monitor",  title: "Prometheus + Grafana", desc: "监控告警",     x: 800, y: 675, w: 230, h: 55, color: "#fa709a" },
        ];

        const an_allBoxes = [...an_clients, ...an_gateways, ...an_services, ...an_stores, ...an_infra];

        // ========== 绘制工具 ==========
        function an_roundRect(x, y, w, h, r) {
            ctx.beginPath();
            ctx.moveTo(x + r, y);
            ctx.lineTo(x + w - r, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + r);
            ctx.lineTo(x + w, y + h - r);
            ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            ctx.lineTo(x + r, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - r);
            ctx.lineTo(x, y + r);
            ctx.quadraticCurveTo(x, y, x + r, y);
            ctx.closePath();
        }

        function an_drawBox(b, highlight) {
            ctx.save();
            // 阴影
            ctx.shadowColor = highlight ? b.color : "rgba(0,0,0,0.15)";
            ctx.shadowBlur = highlight ? 22 : 8;
            ctx.shadowOffsetY = highlight ? 4 : 2;

            // 渐变填充
            const grad = ctx.createLinearGradient(b.x, b.y, b.x, b.y + b.h);
            grad.addColorStop(0, highlight ? b.color : lighten(b.color, 10));
            grad.addColorStop(1, lighten(b.color, 18));
            ctx.fillStyle = grad;
            an_roundRect(b.x, b.y, b.w, b.h, 10);
            ctx.fill();

            ctx.restore();

            // 边框
            ctx.beginPath();
            ctx.strokeStyle = highlight ? "#fff" : "rgba(255,255,255,0.45)";
            ctx.lineWidth = highlight ? 2.5 : 1.2;
            an_roundRect(b.x, b.y, b.w, b.h, 10);
            ctx.stroke();

            // 标题
            ctx.fillStyle = "#fff";
            ctx.font = (highlight ? "bold " : "") + "14px 'Microsoft YaHei', sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(b.title, b.x + b.w / 2, b.y + b.h / 2 - (b.desc ? 9 : 0));

            // 描述
            if (b.desc) {
                ctx.fillStyle = "rgba(255,255,255,0.85)";
                ctx.font = "11px 'Microsoft YaHei', sans-serif";
                ctx.fillText(b.desc, b.x + b.w / 2, b.y + b.h / 2 + 10);
            }
        }

        function lighten(hex, amt) {
            // #rrggbb → 浅化
            const h = hex.replace("#", "");
            const r = Math.min(255, parseInt(h.substr(0, 2), 16) + amt);
            const g = Math.min(255, parseInt(h.substr(2, 2), 16) + amt);
            const b = Math.min(255, parseInt(h.substr(4, 2), 16) + amt);
            return `rgb(${r},${g},${b})`;
        }

        function an_layerHeader(layer) {
            const h = 38;
            const x0 = 20, x1 = C_W - 20;
            const y = layer.y;
            // 背景条
            const grad = ctx.createLinearGradient(x0, y, x1, y);
            grad.addColorStop(0, lighten(layer.color, 35));
            grad.addColorStop(1, lighten(layer.color, 45));
            ctx.fillStyle = grad;
            an_roundRect(x0, y, x1 - x0, h, 6);
            ctx.fill();
            ctx.strokeStyle = layer.color;
            ctx.lineWidth = 1.2;
            an_roundRect(x0, y, x1 - x0, h, 6);
            ctx.stroke();

            // 色条
            ctx.fillStyle = layer.color;
            an_roundRect(x0 + 6, y + 9, 6, h - 18, 3);
            ctx.fill();

            ctx.fillStyle = "#333";
            ctx.font = "bold 15px 'Microsoft YaHei', sans-serif";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(layer.name, x0 + 22, y + h / 2);
        }

        // ========== 画连线 + 箭头 ==========
        function an_arrow(x1, y1, x2, y2, color, dashed) {
            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = 1.4;
            if (dashed) ctx.setLineDash([5, 4]);

            // 三次贝塞尔曲线，拐点柔和
            const midY = (y1 + y2) / 2;
            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.bezierCurveTo(x1, midY, x2, midY, x2, y2);
            ctx.stroke();

            // 箭头
            const ang = Math.atan2(y2 - midY, x2 - x2 + 0.1);
            ctx.setLineDash([]);
            const arrowSize = 7;
            ctx.beginPath();
            ctx.moveTo(x2, y2);
            ctx.lineTo(x2 - arrowSize, y2 - arrowSize);
            ctx.lineTo(x2 - arrowSize, y2 + arrowSize);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        function an_drawConnections() {
            ctx.save();
            ctx.lineWidth = 1.3;

            // 客户端 → 网关（汇总到中间 Nginx）
            for (const c of an_clients) {
                an_arrow(c.x + c.w / 2, c.y + c.h, c.x + c.w / 2, 155, "#667eea");
            }
            // 让客户端汇总线走网关顶部
            ctx.strokeStyle = "#667eea";
            ctx.beginPath();
            ctx.moveTo(250, 145);
            ctx.lineTo(575, 145);
            ctx.stroke();
            ctx.beginPath(); ctx.moveTo(575, 145); ctx.lineTo(575, 178); ctx.stroke();

            // 网关 → 业务服务（网关底部 → 业务顶部汇总）
            ctx.strokeStyle = "#f093fb";
            ctx.beginPath();
            ctx.moveTo(160, 238);   // cdn
            ctx.lineTo(575, 238); ctx.lineTo(575, 280); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(425, 238);   // nginx
            ctx.lineTo(575, 238); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(715, 238);   // gateway
            ctx.lineTo(575, 238); ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(960, 238);   // waf
            ctx.lineTo(575, 238); ctx.stroke();

            // 业务服务 → 数据层（垂直连到下一层）
            ctx.strokeStyle = "#4facfe";
            for (const s of [...an_services]) {
                const cx = s.x + s.w / 2;
                ctx.beginPath();
                ctx.moveTo(cx, s.y + s.h);
                ctx.lineTo(cx, s.y + s.h + 12);
                ctx.stroke();
            }
            // 汇总线
            ctx.beginPath();
            ctx.moveTo(60, 500); ctx.lineTo(1090, 500);
            ctx.stroke();
            // 数据层入口
            for (const st of an_stores) {
                const cx = st.x + st.w / 2;
                ctx.beginPath();
                ctx.moveTo(cx, 500); ctx.lineTo(cx, st.y);
                ctx.stroke();
                // 小箭头
                ctx.beginPath();
                ctx.moveTo(cx, st.y);
                ctx.lineTo(cx - 5, st.y - 6);
                ctx.lineTo(cx + 5, st.y - 6);
                ctx.closePath(); ctx.fillStyle = "#4facfe"; ctx.fill();
            }

            // 基础设施 → 业务（支撑关系，虚线）
            ctx.setLineDash([5, 4]);
            ctx.strokeStyle = "rgba(250,112,154,0.55)";
            for (const svc of an_services) {
                const cx = svc.x + svc.w / 2;
                ctx.beginPath();
                ctx.moveTo(cx, 420 + 75);
                ctx.lineTo(cx, 675);
                ctx.stroke();
            }
            ctx.setLineDash([]);

            ctx.restore();
        }

        // ========== 背景装饰 ==========
        function an_drawBg() {
            ctx.fillStyle = "#f8f9ff";
            ctx.fillRect(0, 0, C_W, C_H);

            // 网格点
            ctx.fillStyle = "rgba(30,60,114,0.07)";
            for (let x = 0; x < C_W; x += 30) {
                for (let y = 0; y < C_H; y += 30) {
                    ctx.beginPath();
                    ctx.arc(x, y, 1, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // ========== 主绘制 ==========
        function an_draw() {
            an_drawBg();
            // 层标题
            for (const l of an_layers) an_layerHeader(l);
            // 连线
            an_drawConnections();
            // 盒子
            for (const b of an_allBoxes) an_drawBox(b, an_hover && an_hover.id === b.id);

            // 悬停信息
            if (an_hover) {
                an_drawTooltip(an_hover);
            }
        }

        function an_drawTooltip(b) {
            const text = b.title + (b.desc ? " — " + b.desc : "");
            ctx.font = "12px 'Microsoft YaHei', sans-serif";
            const padX = 10, padY = 6;
            const tw = ctx.measureText(text).width + padX * 2;
            const th = 20;
            let tx = b.x, ty = b.y - th - 6;
            if (tx + tw > C_W - 10) tx = C_W - tw - 10;
            if (tx < 10) tx = 10;
            if (ty < 0) ty = b.y + b.h + 6;

            ctx.save();
            ctx.fillStyle = "rgba(30,30,60,0.92)";
            an_roundRect(tx, ty, tw, th, 5);
            ctx.fill();
            ctx.fillStyle = "#fff";
            ctx.textAlign = "left";
            ctx.textBaseline = "middle";
            ctx.fillText(text, tx + padX, ty + th / 2);
            ctx.restore();
        }

        // ========== 鼠标交互 ==========
        canvas.addEventListener("mousemove", e => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = C_W / rect.width;
            const scaleY = C_H / rect.height;
            const mx = (e.clientX - rect.left) * scaleX;
            const my = (e.clientY - rect.top) * scaleY;
            let found = null;
            for (const b of an_allBoxes) {
                if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
                    found = b; break;
                }
            }
            an_hover = found;
            canvas.style.cursor = found ? "pointer" : "default";
            an_draw();
        });

        // ========== 缩放 / 重置 / 导出 ==========
        function an_zoom(dir) {
            an_scale = Math.max(0.5, Math.min(2.5, an_scale + dir * 0.2));
            canvas.style.width = (C_W * an_scale) + "px";
        }
        function an_resetView() {
            an_scale = 1;
            canvas.style.width = "100%";
            document.querySelectorAll(".an_tools button").forEach(b => b.classList.remove("active"));
            event.target.classList.add("active");
        }
        function an_export() {
            const url = canvas.toDataURL("image/png");
            const a = document.createElement("a");
            a.href = url;
            a.download = "电商系统架构图-安家成.png";
            a.click();
        }

        // 启动
        an_draw();
    </script>
</body>
</html>
